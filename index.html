<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GyaanBot - Virtual Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ðŸ¤–</text></svg>" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100;200;300;400;500;600;700&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto Mono", monospace;
    }

    .main {
      min-height: 100vh;
      width: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      padding: 10px;
      text-align: center;
    }

    .image-container .image img {
      width: 350px;
      max-width: 90vw;
    }

    .image-container h1 {
      color: #00bcd4;
      margin: 10px 0;
      font-size: 40px;
    }

    @media (max-width: 768px) {
      .image-container h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 480px) {
      .image-container h1 {
        font-size: 28px;
      }
    }

    .image-container p {
      color: #9eb9bb;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    /* Floating Bot Button */
    .floating-bot {
      position: relative;
      width: auto;
      min-width: 70px;
      height: 70px;
      padding: 0 25px;
      margin: 30px auto 0;
      background: linear-gradient(135deg, #00bcd4, #0097a7);
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 188, 212, 0.5);
      z-index: 9999;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .floating-bot {
        min-width: 60px;
        height: 60px;
        padding: 0 20px;
        margin: 25px auto 0;
        border-radius: 30px;
      }
    }

    @media (max-width: 480px) {
      .floating-bot {
        min-width: 55px;
        height: 55px;
        padding: 0 15px;
        margin: 20px auto 0;
        border-radius: 27px;
      }
      
      .floating-bot span {
        font-size: 13px !important;
      }
    }

    .floating-bot:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 30px rgba(0, 188, 212, 0.7);
    }

    .floating-bot i {
      font-size: 28px;
      color: #fff;
      flex-shrink: 0;
    }
    
    .floating-bot span {
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
      margin-left: 10px;
    }

    .floating-bot.listening {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

  </style>
</head>

<body>
  <section class="main">
    <div class="image-container">
      <div class="image">
        <img src="jarvis-jarvischatbot (1).gif" alt="image" />
      </div>
      <h1>GyaanBot</h1>
      <p>I'm GyaanBot, your virtual assistant. How may I help you?</p>
      <div class="floating-bot" id="floatingBot"><i class="fas fa-microphone-alt"></i><span>Click here to speak</span></div>
    </div>
  </section>

  <script >
    const floatingBot = document.getElementById("floatingBot");
    const WEATHER_API_KEY = "YOUR_OPENWEATHERMAP_API_KEY";

    async function getWikipediaAnswer(question) {
      try {
        console.log("ðŸ“š Searching Wikipedia for:", question);
        
        // Extract main topic from question
        let searchTerm = question
          .replace(/what is|who is|what are|tell me about|tell me who/gi, '')
          .trim();
        
        console.log("ðŸ” Search term:", searchTerm);
        
        // Wikipedia API
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchTerm)}`;
        const response = await fetch(url);
        
        if (response.ok) {
          const data = await response.json();
          if (data.extract) {
            // Get first 2-3 sentences
            const sentences = data.extract.split('. ').slice(0, 2).join('. ') + '.';
            console.log("âœ… Wikipedia answer found:", sentences);
            return sentences;
          }
        }
        
        console.log("âŒ No Wikipedia answer");
        return null;
      } catch (error) {
        console.error("Wikipedia API error:", error);
        return null;
      }
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;
      utterance.lang = "en-US";
      window.speechSynthesis.speak(utterance);
    }

    function calculateMath(expression) {
      try {
        const match = expression.match(/(\d+\.?\d*)\s*(plus|add|\+|minus|subtract|\-|times|multiply|\*|x|divided by|divide|\/)\s*(\d+\.?\d*)/i);
        if (!match) return null;
        
        const num1 = parseFloat(match[1]);
        const operation = match[2].toLowerCase();
        const num2 = parseFloat(match[3]);
        let result;
        
        if (operation.includes('plus') || operation.includes('add') || operation === '+') {
          result = num1 + num2;
        } else if (operation.includes('minus') || operation.includes('subtract') || operation === '-') {
          result = num1 - num2;
        } else if (operation.includes('times') || operation.includes('multiply') || operation === '*' || operation === 'x') {
          result = num1 * num2;
        } else if (operation.includes('divided') || operation.includes('divide') || operation === '/') {
          result = num1 / num2;
        }
        
        return result;
      } catch (e) {
        return null;
      }
    }

    function wishMe() {
      const hour = new Date().getHours();
      if (hour < 12) speak("Good morning Boss!");
      else if (hour < 17) speak("Good afternoon Master!");
      else speak("Good evening Sir!");
    }

    window.addEventListener("load", () => {
      if (!sessionStorage.getItem("gyaanBotInitialized")) {
        speak("Initializing GyaanBot...");
        wishMe();
        sessionStorage.setItem("gyaanBotInitialized", "true");
      }
    });

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      alert("Sorry! Your browser doesn't support Speech Recognition. Use Chrome/Edge.");
    }
    
    const recognition = new SpeechRecognition();
    
    // Detect if mobile
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // FALSE for better mobile control - we'll manually restart
    recognition.continuous = false;
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    
    let isListening = false;
    let recognitionActive = false;
    let watchdogTimer = null;
    let lastHeardTime = Date.now();

    // Watchdog function - ensures mic ALWAYS stays on
    function startWatchdog() {
      if (watchdogTimer) clearInterval(watchdogTimer);
      
      watchdogTimer = setInterval(() => {
        if (isListening && !recognitionActive) {
          console.log("âš ï¸ Watchdog: Mic stopped! Restarting...");
          try {
            recognition.start();
            console.log("âœ… Watchdog restart successful");
          } catch (e) {
            console.log("Watchdog: Already running or restarting");
          }
        }
      }, 1000); // Check every 1 second (faster!)
    }

    function stopWatchdog() {
      if (watchdogTimer) {
        clearInterval(watchdogTimer);
        watchdogTimer = null;
      }
    }

    recognition.onstart = () => {
      recognitionActive = true;
      console.log("âœ… Voice recognition started - Continuous Mode");
      floatingBot.classList.add("listening");
    };

    recognition.onresult = (event) => {
      lastHeardTime = Date.now();
      
      // Get latest result
      const resultIndex = event.results.length - 1;
      const transcript = event.results[resultIndex][0].transcript;
      console.log("ðŸŽ¤ Heard:", transcript);
      takeCommand(transcript.toLowerCase());
      
      // Mobile needs more aggressive restart after command
      if (isMobile) {
        setTimeout(() => {
          if (isListening) {
            console.log("ðŸ“± Mobile: Force restart after command");
            try {
              recognition.stop(); // Stop first
              setTimeout(() => {
                if (isListening) {
                  recognition.start(); // Then restart
                }
              }, 200);
            } catch (e) {
              console.log("Mobile restart in progress...");
            }
          }
        }, 1000); // Wait 1 second after command
      }
      
      // Reset status after processing
      setTimeout(() => {
        // Status reset (no UI update needed)
      }, 1500);
    };

    recognition.onerror = (event) => {
      console.error("âŒ Error:", event.error);
      recognitionActive = false;
      
      if (event.error === 'no-speech') {
        console.log("No speech detected, will restart after delay...");
        // Mobile: longer delay to avoid battery drain
        const delay = isMobile ? 3000 : 2000;
        setTimeout(() => {
          if (isListening && !recognitionActive) {
            try {
              recognition.start();
              console.log("âœ… Restarted after no-speech delay");
            } catch (e) {
              console.log("Already running");
            }
          }
        }, delay);
        return;
      }
      
      if (event.error === 'aborted') {
        console.log("Recognition aborted, will restart...");
        return;
      }
      
      console.log(`Error: ${event.error}`);
      
      if (event.error === 'not-allowed') {
        floatingBot.classList.remove("listening");
        isListening = false;
        stopWatchdog();
      }
    };

    recognition.onend = () => {
      console.log("â¹ï¸ Recognition ended");
      recognitionActive = false;
      
      // AGGRESSIVE AUTO-RESTART - no delays, immediate restart
      if (isListening) {
        console.log("ðŸ”„ IMMEDIATE restart for continuous mode");
        // Try multiple times to ensure restart
        const attemptRestart = (attemptNum) => {
          if (!isListening) return;
          
          try {
            recognition.start();
            console.log(`âœ… Restart attempt ${attemptNum} successful`);
          } catch (e) {
            console.log(`âŒ Attempt ${attemptNum} failed: ${e.message}`);
            if (attemptNum < 5) {
              // Try again up to 5 times
              setTimeout(() => attemptRestart(attemptNum + 1), 100 * attemptNum);
            }
          }
        };
        
        // Start first attempt immediately
        attemptRestart(1);
      } else {
        floatingBot.classList.remove("listening");
        stopWatchdog();
      }
    };

    // Floating bot button
    floatingBot.addEventListener("click", () => {
      console.log("ðŸ”µ Floating button clicked, isListening:", isListening);
      
      if (isListening) {
        // Stop continuous mode
        console.log("ðŸ›‘ Stopping continuous mode");
        isListening = false;
        stopWatchdog();
        try {
          recognition.stop();
        } catch (e) {
          console.log("Already stopped");
        }
        floatingBot.classList.remove("listening");
        return;
      }
      
      // Start continuous mode
      isListening = true;
      startWatchdog(); // Start watchdog
      
      try {
        recognition.start();
        console.log("ðŸŽ™ï¸ Recognition.start() called");
      } catch (e) {
        console.error("âŒ Start failed:", e);
        isListening = false;
        stopWatchdog();
      }
    });

    async function convertCurrency(amount, from, to) {
      try {
        const apiUrl = `https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.result) {
          speak(
            `The converted amount is ${data.result.toFixed(2)} ${to.toUpperCase()}`
          );
        } else speak("Sorry, I couldn't fetch the conversion rate.");
      } catch {
        speak("An error occurred while converting currency.");
      }
    }

    async function getWeather(location) {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${location}&units=metric&appid=${WEATHER_API_KEY}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          speak("I couldn't find weather data for that location.");
          return;
        }
        const data = await res.json();
        const temp = data.main.temp;
        const desc = data.weather[0].description;
        speak(`The temperature in ${location} is ${temp}Â°C with ${desc}.`);
      } catch {
        speak("Error fetching weather data.");
      }
    }

    function getDirections(destination) {
      if (!destination) {
        speak("Please specify a destination.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          const url = `https://www.google.com/maps/dir/?api=1&origin=${latitude},${longitude}&destination=${encodeURIComponent(
            destination
          )}`;
          speak(`Getting directions to ${destination}`);
          window.open(url, "_blank");
        },
        () => speak("Please enable location permissions.")
      );
    }

    let currentMusicTab = null; // Track music tab

    function takeCommand(message) {
      
      // Convert to lowercase once at the start
      const lowerMsg = message.toLowerCase();
      
      // Calculator
      if (lowerMsg.includes("calculate") || (lowerMsg.includes("what is") && (lowerMsg.includes("plus") || lowerMsg.includes("minus") || lowerMsg.includes("times") || lowerMsg.includes("divided")))) {
        const result = calculateMath(message);
        if (result !== null) {
          speak(`The answer is ${result}`);
          return;
        }
      }
      
      // Jokes
      if (lowerMsg.includes("tell me a joke") || lowerMsg.includes("joke")) {
        const jokes = [
          "Why don't scientists trust atoms? Because they make up everything!",
          "Why did the computer go to the doctor? Because it had a virus!",
          "What do you call a bear with no teeth? A gummy bear!",
          "Why don't programmers like nature? It has too many bugs!"
        ];
        const joke = jokes[Math.floor(Math.random() * jokes.length)];
        speak(joke);
        return;
      }
      
      // Fun facts
      if (lowerMsg.includes("tell me a fact") || lowerMsg.includes("fun fact") || lowerMsg.includes("fact")) {
        const facts = [
          "Honey never spoils. Archaeologists have found 3000 year old honey!",
          "A group of flamingos is called a flamboyance.",
          "Octopuses have three hearts and blue blood.",
          "Bananas are berries, but strawberries aren't!"
        ];
        const fact = facts[Math.floor(Math.random() * facts.length)];
        speak(fact);
        return;
      }
      
      // Help
      if (lowerMsg.includes("help") || lowerMsg.includes("what can you do")) {
        speak("I can calculate math, tell jokes and facts, open websites, play music, answer questions, and much more!");
        return;
      }
      
      // SPECIFIC QUESTIONS FIRST (hardcoded answers - faster & reliable)
      if (lowerMsg.includes("who is") && (lowerMsg.includes("pm") || lowerMsg.includes("prime minister"))) {
        const answer = "Narendra Modi is the Prime Minister of India. He took office on May 26, 2014, and is currently serving his third consecutive term.";
        speak(answer);
        return;
      }
      
      if (lowerMsg.includes("what is ai") || lowerMsg.includes("artificial intelligence")) {
        const answer = "Artificial Intelligence is computer technology that allows machines to learn, solve problems, and do tasks like humans.";
        speak(answer);
        return;
      }
      
      if (lowerMsg.includes("what is python")) {
        const answer = "Python is a popular programming language known for being easy to learn. It's widely used for web development, data science, and artificial intelligence.";
        speak(answer);
        return;
      }
      
      if (lowerMsg.includes("what is computer")) {
        const answer = "A computer is an electronic device that processes data and performs tasks. It can store, retrieve, and process information quickly.";
        speak(answer);
        return;
      }
      
      // GENERIC QUESTIONS - Wikipedia (for everything else)
      if (lowerMsg.includes("what is") || lowerMsg.includes("who is") || lowerMsg.includes("what are") || lowerMsg.includes("tell me about")) {
        
        // Get Wikipedia answer FIRST, THEN speak
        getWikipediaAnswer(message).then(answer => {
          if (answer) {
            console.log("ðŸ”Š Speaking Wikipedia answer:", answer);
            speak(answer); // SPEAK THE ACTUAL ANSWER
          } else {
            // No Wikipedia answer - speak fallback
            speak("Sorry, I couldn't find an answer on Wikipedia.");
            
            // Open Google search as fallback
            setTimeout(() => {
              const query = message.replace(/ /g, "+");
              window.open(`https://www.google.com/search?q=${query}`, "_blank", "noopener,noreferrer");
            }, 100);
          }
        }).catch(err => {
          console.error("Wikipedia error:", err);
          speak("Error searching for answer.");
        });
        
        return;
      }
      
      if (lowerMsg.includes("hello") || lowerMsg.includes("hey")) {
        speak("Hello Sir, how may I assist you?");
        
      } else if (lowerMsg.includes("music off") || lowerMsg.includes("stop music") || lowerMsg.includes("pause music")) {
        // Close music tab if open
        if (currentMusicTab && !currentMusicTab.closed) {
          currentMusicTab.close();
          currentMusicTab = null;
          speak("Music stopped");
        } else {
          speak("No music is currently playing");
        }
        
      } else if (lowerMsg.includes("play music") || lowerMsg.includes("play punjabi music")) {
        speak("Playing music...");
        // Music can open in background without stealing focus on mobile
        currentMusicTab = window.open("https://www.youtube.com/watch?v=w9Qo6p4XsXE", "_blank", "noopener,noreferrer");
        // Return focus to main window immediately
        window.focus();
        
      } else if (lowerMsg.includes("convert currency")) {
        const match = message.match(/convert (\d+(\.\d+)?) (\w{3}) to (\w{3})/);
        if (match)
          convertCurrency(match[1], match[3].toUpperCase(), match[4].toUpperCase());
        else speak("Please say like: convert 100 USD to INR.");
      } else if (lowerMsg.includes("weather in")) {
        const loc = message.replace(/weather in/i, "").trim();
        getWeather(loc);
      } else if (lowerMsg.includes("open google")) {
        speak("Opening Google...");
        window.open("https://google.com", "_blank", "noopener");
      } else if (lowerMsg.includes("open youtube")) {
        speak("Opening YouTube...");
        window.open("https://youtube.com", "_blank", "noopener");
      } else if (lowerMsg.includes("open whatsapp")) {
        speak("Opening WhatsApp...");
        window.open("https://web.whatsapp.com/", "_blank", "noopener");
      } else if (lowerMsg.includes("chat with mom")) {
        speak("Opening chat with Mom...");
        window.open("https://wa.me/916232899904", "_blank", "noopener");
      } else if (lowerMsg.includes("call mom")) {
        speak("Calling Mom...");
        window.open("https://wa.me/916232899904?call=true", "_blank", "noopener");
      } else if (lowerMsg.includes("open github")) {
        speak("Opening your GitHub...");
        window.open("https://github.com/Anshraj11111", "_blank", "noopener");
      } else if (lowerMsg.includes("open my channel")) {
        speak("Opening your YouTube channel...");
        window.open(
          "https://youtube.com/@keystrokescoffee?si=q1ovNa5UyW87GknN",
          "_blank", "noopener"
        );
      } else if (
        lowerMsg.includes("what is") ||
        lowerMsg.includes("who is") ||
        lowerMsg.includes("what are")
      ) {
        const q = message.replace(/ /g, "+");
        window.open(`https://www.google.com/search?q=${q}`, "_blank", "noopener");
        speak("Hereâ€™s what I found on Google.");
      } else if (lowerMsg.includes("wikipedia")) {
        const q = message.replace(/wikipedia/i, "").trim();
        speak("ROBOT MODE - No redirect");
        const time = new Date().toLocaleTimeString();
        speak(`The time is ${time}`);
      } else if (lowerMsg.includes("date")) {
        const date = new Date().toLocaleDateString();
        speak(`Today's date is ${date}`);
      } else if (lowerMsg.includes("direction to")) {
        const destination = message.replace(/direction to/i, "").trim();
        getDirections(destination);
      } else if (lowerMsg.includes("go back")) {
        window.location.href = "index.html";
        speak("Going back to the main page...");
      } else {
        window.open(
          `https://www.google.com/search?q=${message.replace(/ /g, "+")}`,
          "_blank", "noopener"
        );
        speak(`Hereâ€™s what I found for ${message}`);
      }
    }
  </script>
</body>
</html>
