<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GyaanBot - Virtual Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100;200;300;400;500;600;700&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto Mono", monospace;
    }

    .main {
      min-height: 100vh;
      width: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      padding: 10px;
      text-align: center;
    }

    .image-container .image img {
      width: 350px;
      max-width: 90vw;
    }

    .image-container h1 {
      color: #00bcd4;
      margin: 10px 0;
      font-size: 40px;
    }

    @media (max-width: 768px) {
      .image-container h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 480px) {
      .image-container h1 {
        font-size: 28px;
      }
    }

    .image-container p {
      color: #9eb9bb;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    .input {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 40vw;
      min-width: 300px;
      max-width: 90vw;
      height: 50px;
      border-radius: 25px;
      background: rgb(202 253 255 / 50%);
      padding: 0 5px;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .input {
        width: 85vw;
        min-width: 280px;
        height: 48px;
      }
    }

    @media (max-width: 480px) {
      .input {
        width: 90vw;
        min-width: 250px;
        height: 45px;
        border-radius: 20px;
      }
    }

    .talk {
      background: transparent;
      outline: none;
      border: none;
      width: 50px;
      height: 50px;
      min-width: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .talk {
        width: 45px;
        height: 45px;
        min-width: 45px;
      }
    }

    .talk i {
      font-size: 20px;
      color: #aed0d0;
    }

    .content {
      color: #aed0d0;
      font-size: 15px;
      margin-left: 15px;
      margin-right: 15px;
      flex: 1;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .content {
        font-size: 13px;
        margin-left: 10px;
        margin-right: 10px;
      }
    }

    /* Floating Bot Button */
    .floating-bot {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #00bcd4, #0097a7);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 188, 212, 0.5);
      z-index: 9999;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .floating-bot {
        width: 60px;
        height: 60px;
        bottom: 25px;
        right: 25px;
      }
    }

    @media (max-width: 480px) {
      .floating-bot {
        width: 55px;
        height: 55px;
        bottom: 20px;
        right: 20px;
      }
    }

    .floating-bot:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(0, 188, 212, 0.7);
    }

    .floating-bot i {
      font-size: 28px;
      color: #fff;
    }

    .floating-bot.listening {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Bot Panel */
    .bot-panel {
      position: fixed;
      bottom: 120px;
      right: 30px;
      width: 350px;
      max-width: calc(100vw - 60px);
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid #00bcd4;
      border-radius: 15px;
      padding: 20px;
      display: none;
      z-index: 9998;
      box-shadow: 0 8px 32px rgba(0, 188, 212, 0.3);
    }

    @media (max-width: 768px) {
      .bot-panel {
        width: 320px;
        bottom: 105px;
        right: 25px;
        padding: 15px;
      }
    }

    @media (max-width: 480px) {
      .bot-panel {
        width: calc(100vw - 50px);
        bottom: 90px;
        right: 20px;
        left: 25px;
        padding: 12px;
      }
    }

    .bot-panel.active {
      display: block;
    }

    .bot-response {
      color: #00bcd4;
      font-size: 14px;
      margin-bottom: 15px;
      min-height: 40px;
      padding: 10px;
      background: rgba(0, 188, 212, 0.1);
      border-radius: 8px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .bot-response {
        font-size: 12px;
        padding: 8px;
        min-height: 35px;
      }
    }

    .bot-status {
      color: #9eb9bb;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .bot-status {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <section class="main">
    <div class="image-container">
      <div class="image">
        <img src="jarvis-jarvischatbot (1).gif" alt="image" />
      </div>
      <h1>GyaanBot</h1>
      <p>I’m GyaanBot, your virtual assistant. How may I help you?</p>
    </div>

    <div class="input">
      <button class="talk"><i class="fas fa-microphone-alt"></i></button>
      <h1 class="content">Click here to speak</h1>
    </div>
  </section>

  <!-- Floating Bot Button (Always Visible) -->
  <div class="floating-bot" id="floatingBot">
    <i class="fas fa-microphone-alt"></i>
  </div>

  <!-- Bot Panel (Shows responses) -->
  <div class="bot-panel" id="botPanel">
    <div class="bot-response" id="botResponse">Click the mic to speak...</div>
    <div class="bot-status" id="botStatus">Ready</div>
    <input type="text" id="textInput" placeholder="Or type command here..." style="width:100%; padding:10px; margin-top:10px; background:#111; border:1px solid #00bcd4; color:#00bcd4; border-radius:5px; font-size:14px;">
  </div>

  <script >
    const btn = document.querySelector(".talk");
    const content = document.querySelector(".content");
    const floatingBot = document.getElementById("floatingBot");
    const botPanel = document.getElementById("botPanel");
    const botResponse = document.getElementById("botResponse");
    const botStatus = document.getElementById("botStatus");
    const textInput = document.getElementById("textInput");
    const WEATHER_API_KEY = "YOUR_OPENWEATHERMAP_API_KEY";

    async function getWikipediaAnswer(question) {
      try {
        console.log("📚 Searching Wikipedia for:", question);
        
        // Extract main topic from question
        let searchTerm = question
          .replace(/what is|who is|what are|tell me about|tell me who/gi, '')
          .trim();
        
        console.log("🔍 Search term:", searchTerm);
        
        // Wikipedia API
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchTerm)}`;
        const response = await fetch(url);
        
        if (response.ok) {
          const data = await response.json();
          if (data.extract) {
            // Get first 2-3 sentences
            const sentences = data.extract.split('. ').slice(0, 2).join('. ') + '.';
            console.log("✅ Wikipedia answer found:", sentences);
            return sentences;
          }
        }
        
        console.log("❌ No Wikipedia answer");
        return null;
      } catch (error) {
        console.error("Wikipedia API error:", error);
        return null;
      }
    }

    // Text input handler
    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && textInput.value.trim()) {
        const command = textInput.value.trim();
        botResponse.textContent = `You typed: "${command}"`;
        botStatus.textContent = "Processing...";
        takeCommand(command.toLowerCase());
        textInput.value = "";
        setTimeout(() => botStatus.textContent = "Ready", 2000);
      }
    });

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;
      utterance.lang = "en-US";
      window.speechSynthesis.speak(utterance);
      
      // Show response in floating panel
      botResponse.textContent = text;
    }

    function calculateMath(expression) {
      try {
        const match = expression.match(/(\d+\.?\d*)\s*(plus|add|\+|minus|subtract|\-|times|multiply|\*|x|divided by|divide|\/)\s*(\d+\.?\d*)/i);
        if (!match) return null;
        
        const num1 = parseFloat(match[1]);
        const operation = match[2].toLowerCase();
        const num2 = parseFloat(match[3]);
        let result;
        
        if (operation.includes('plus') || operation.includes('add') || operation === '+') {
          result = num1 + num2;
        } else if (operation.includes('minus') || operation.includes('subtract') || operation === '-') {
          result = num1 - num2;
        } else if (operation.includes('times') || operation.includes('multiply') || operation === '*' || operation === 'x') {
          result = num1 * num2;
        } else if (operation.includes('divided') || operation.includes('divide') || operation === '/') {
          result = num1 / num2;
        }
        
        return result;
      } catch (e) {
        return null;
      }
    }

    function wishMe() {
      const hour = new Date().getHours();
      if (hour < 12) speak("Good morning Boss!");
      else if (hour < 17) speak("Good afternoon Master!");
      else speak("Good evening Sir!");
    }

    window.addEventListener("load", () => {
      if (!sessionStorage.getItem("gyaanBotInitialized")) {
        speak("Initializing GyaanBot...");
        wishMe();
        sessionStorage.setItem("gyaanBotInitialized", "true");
      }
    });

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      alert("Sorry! Your browser doesn't support Speech Recognition. Use Chrome/Edge.");
    }
    
    const recognition = new SpeechRecognition();
    recognition.continuous = true; // CONTINUOUS MODE ENABLED
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    
    let isListening = false; // Prevent multiple starts

    recognition.onstart = () => {
      console.log("✅ Voice recognition started - Continuous Mode");
      botStatus.textContent = "🔴 Listening continuously...";
      floatingBot.classList.add("listening");
    };

    recognition.onresult = (event) => {
      // Get latest result for continuous mode
      const resultIndex = event.results.length - 1;
      const transcript = event.results[resultIndex][0].transcript;
      console.log("🎤 Heard:", transcript);
      if (content) content.textContent = transcript;
      botResponse.textContent = `You said: "${transcript}"`;
      botStatus.textContent = "Processing...";
      takeCommand(transcript.toLowerCase());
      // Don't stop listening - continuous mode!
      setTimeout(() => {
        if (isListening) {
          botStatus.textContent = "🔴 Listening...";
        }
      }, 2000);
    };

    recognition.onerror = (event) => {
      console.error("❌ Error:", event.error);
      
      if (event.error === 'no-speech') {
        console.log("No speech detected, continuing...");
        return; // Don't stop
      }
      
      botStatus.textContent = `Error: ${event.error}`;
      botResponse.textContent = event.error === 'not-allowed' 
        ? "Please allow microphone access!" 
        : "Error - Try again";
      
      if (event.error === 'not-allowed') {
        floatingBot.classList.remove("listening");
        isListening = false;
      }
    };

    recognition.onend = () => {
      console.log("⏹️ Recognition ended");
      
      // Auto-restart if listening mode is still active
      if (isListening) {
        console.log("🔄 Auto-restarting continuous mode...");
        setTimeout(() => {
          if (isListening) {
            try {
              recognition.start();
              console.log("✅ Restarted successfully");
            } catch (e) {
              console.error("❌ Restart failed:", e);
              setTimeout(() => {
                if (isListening) recognition.start();
              }, 500);
            }
          }
        }, 100); // Quick restart
      } else {
        floatingBot.classList.remove("listening");
        botStatus.textContent = "Stopped";
      }
    };

    // Main page button
    if (btn) {
      btn.addEventListener("click", () => {
        if (isListening) return; // Prevent double start
        if (content) content.textContent = "Listening...";
        isListening = true;
        recognition.start();
      });
    }

    // Floating bot button
    floatingBot.addEventListener("click", () => {
      console.log("🔵 Floating button clicked, isListening:", isListening);
      
      if (isListening) {
        // Already listening, just toggle panel
        botPanel.classList.toggle("active");
        return;
      }
      
      botPanel.classList.add("active");
      botStatus.textContent = "Starting...";
      botResponse.textContent = "Speak now...";
      isListening = true;
      
      try {
        recognition.start();
        console.log("🎙️ Recognition.start() called");
      } catch (e) {
        console.error("❌ Start failed:", e);
        botStatus.textContent = "Error starting mic";
        isListening = false;
      }
    });

    async function convertCurrency(amount, from, to) {
      try {
        const apiUrl = `https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.result) {
          speak(
            `The converted amount is ${data.result.toFixed(2)} ${to.toUpperCase()}`
          );
        } else speak("Sorry, I couldn't fetch the conversion rate.");
      } catch {
        speak("An error occurred while converting currency.");
      }
    }

    async function getWeather(location) {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${location}&units=metric&appid=${WEATHER_API_KEY}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          speak("I couldn't find weather data for that location.");
          return;
        }
        const data = await res.json();
        const temp = data.main.temp;
        const desc = data.weather[0].description;
        speak(`The temperature in ${location} is ${temp}°C with ${desc}.`);
      } catch {
        speak("Error fetching weather data.");
      }
    }

    function getDirections(destination) {
      if (!destination) {
        speak("Please specify a destination.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          const url = `https://www.google.com/maps/dir/?api=1&origin=${latitude},${longitude}&destination=${encodeURIComponent(
            destination
          )}`;
          speak(`Getting directions to ${destination}`);
          window.open(url, "_blank");
        },
        () => speak("Please enable location permissions.")
      );
    }

    let currentMusicTab = null; // Track music tab

    function takeCommand(message) {
      botStatus.textContent = "Ready";
      
      // Calculator
      if (message.includes("calculate") || (message.includes("what is") && (message.includes("plus") || message.includes("minus") || message.includes("times") || message.includes("divided")))) {
        const result = calculateMath(message);
        if (result !== null) {
          speak(`The answer is ${result}`);
          botResponse.textContent = `= ${result}`;
          return;
        }
      }
      
      // Jokes
      if (message.includes("tell me a joke") || message.includes("joke")) {
        const jokes = [
          "Why don't scientists trust atoms? Because they make up everything!",
          "Why did the computer go to the doctor? Because it had a virus!",
          "What do you call a bear with no teeth? A gummy bear!",
          "Why don't programmers like nature? It has too many bugs!"
        ];
        const joke = jokes[Math.floor(Math.random() * jokes.length)];
        speak(joke);
        return;
      }
      
      // Fun facts
      if (message.includes("tell me a fact") || message.includes("fun fact") || message.includes("fact")) {
        const facts = [
          "Honey never spoils. Archaeologists have found 3000 year old honey!",
          "A group of flamingos is called a flamboyance.",
          "Octopuses have three hearts and blue blood.",
          "Bananas are berries, but strawberries aren't!"
        ];
        const fact = facts[Math.floor(Math.random() * facts.length)];
        speak(fact);
        return;
      }
      
      // Help
      if (message.includes("help") || message.includes("what can you do")) {
        speak("I can calculate math, tell jokes and facts, open websites, play music, answer questions, and much more!");
        return;
      }
      
      // Real-time Wikipedia answers for ANY question
      const lowerMsg = message.toLowerCase(); // DEFINE IT HERE
      
      if (lowerMsg.includes("what is") || lowerMsg.includes("who is") || lowerMsg.includes("what are") || lowerMsg.includes("tell me about")) {
        speak("Let me search that for you.");
        
        // Open Google immediately
        const query = message.replace(/ /g, "+");
        window.open(`https://www.google.com/search?q=${query}`, "_blank");
        
        // Get Wikipedia answer and speak it
        getWikipediaAnswer(message).then(answer => {
          if (answer) {
            console.log("🔊 Speaking Wikipedia answer");
            speak(answer);
            botResponse.textContent = answer;
          } else {
            speak("I've opened the search results for you.");
          }
        });
        
        return;
      }
      
      if (lowerMsg.includes("who is") && (lowerMsg.includes("pm") || lowerMsg.includes("prime minister"))) {
        const answer = "Narendra Modi is the Prime Minister of India. He took office on May 26, 2014, and is currently serving his third consecutive term.";
        speak(answer);
        window.open("https://www.google.com/search?q=Prime+Minister+of+India", "_blank");
        return;
      }
      
      if (message.includes("what is ai") || message.includes("artificial intelligence")) {
        const answer = "Artificial Intelligence is computer technology that allows machines to learn, solve problems, and do tasks like humans.";
        speak(answer);
        window.open("https://www.google.com/search?q=what+is+AI", "_blank");
        return;
      }
      
      if (message.includes("what is python")) {
        const answer = "Python is a popular programming language known for being easy to learn. It's widely used for web development, data science, and artificial intelligence.";
        speak(answer);
        window.open("https://www.google.com/search?q=what+is+python", "_blank");
        return;
      }
      
      if (message.includes("what is computer")) {
        const answer = "A computer is an electronic device that processes data and performs tasks. It can store, retrieve, and process information quickly.";
        speak(answer);
        window.open("https://www.google.com/search?q=what+is+computer", "_blank");
        return;
      }
      
      if (message.includes("hello") || message.includes("hey")) {
        speak("Hello Sir, how may I assist you?");
        
      } else if (message.includes("music off") || message.includes("stop music") || message.includes("pause music")) {
        // Close music tab if open
        if (currentMusicTab && !currentMusicTab.closed) {
          currentMusicTab.close();
          currentMusicTab = null;
          speak("Music stopped");
        } else {
          speak("No music is currently playing");
        }
        
      } else if (message.includes("play music") || message.includes("play punjabi music")) {
        currentMusicTab = window.open("https://www.youtube.com/watch?v=w9Qo6p4XsXE", "_blank");
        speak("Playing music...");
        
      } else if (message.includes("convert currency")) {
        const match = message.match(/convert (\d+(\.\d+)?) (\w{3}) to (\w{3})/);
        if (match)
          convertCurrency(match[1], match[3].toUpperCase(), match[4].toUpperCase());
        else speak("Please say like: convert 100 USD to INR.");
      } else if (message.includes("weather in")) {
        const loc = message.replace("weather in", "").trim();
        getWeather(loc);
      } else if (message.includes("open google")) {
        window.open("https://google.com", "_blank");
        speak("Opening Google...");
      } else if (message.includes("open youtube")) {
        window.open("https://youtube.com", "_blank");
        speak("Opening YouTube...");
      } else if (message.includes("open whatsapp")) {
        window.open("https://web.whatsapp.com/", "_blank");
        speak("Opening WhatsApp...");
      } else if (message.includes("chat with mom")) {
        window.open("https://wa.me/916232899904", "_blank");
        speak("Opening chat with Mom...");
      } else if (message.includes("call mom")) {
        window.open("https://wa.me/916232899904?call=true", "_blank");
        speak("Calling Mom...");
      } else if (message.includes("open github")) {
        window.open("https://github.com/Anshraj11111", "_blank");
        speak("Opening your GitHub...");
      } else if (message.includes("open my channel")) {
        window.open(
          "https://youtube.com/@keystrokescoffee?si=q1ovNa5UyW87GknN",
          "_blank"
        );
        speak("Opening your YouTube channel...");
      } else if (
        message.includes("what is") ||
        message.includes("who is") ||
        message.includes("what are")
      ) {
        const q = message.replace(/ /g, "+");
        window.open(`https://www.google.com/search?q=${q}`, "_blank");
        speak("Here’s what I found on Google.");
      } else if (message.includes("wikipedia")) {
        const q = message.replace("wikipedia", "").trim();
        window.open(`https://en.wikipedia.org/wiki/${q}`, "_blank");
        speak("Here’s the Wikipedia result.");
      } else if (message.includes("time")) {
        const time = new Date().toLocaleTimeString();
        speak(`The time is ${time}`);
      } else if (message.includes("date")) {
        const date = new Date().toLocaleDateString();
        speak(`Today's date is ${date}`);
      } else if (message.includes("direction to")) {
        const destination = message.replace("direction to", "").trim();
        getDirections(destination);
      } else if (message.includes("go back")) {
        window.location.href = "index.html";
        speak("Going back to the main page...");
      } else {
        window.open(
          `https://www.google.com/search?q=${message.replace(/ /g, "+")}`,
          "_blank"
        );
        speak(`Here’s what I found for ${message}`);
      }
    }
  </script>
</body>
</html>
