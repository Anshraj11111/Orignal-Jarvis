<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      background: #000;
      color: #00bcd4;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }
    p {
      color: #9eb9bb;
      font-size: 14px;
      margin: 10px 0;
    }
    .emoji {
      font-size: 48px;
      margin: 10px 0;
    }
    .shortcut {
      background: rgba(0, 188, 212, 0.2);
      padding: 8px;
      border-radius: 5px;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="emoji">🤖</div>
  <h2>GyaanBot</h2>
  <p>Your voice assistant is active!</p>
  <div class="shortcut">Ctrl + Shift + J</div>
  <p>Press shortcut or click floating button to start</p>
  <p style="font-size: 12px; margin-top: 20px;">
    Works on every page!<br>
    Continuous listening mode enabled.
  </p>
</body>
</html>
